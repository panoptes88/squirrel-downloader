name: Build and Push Docker Image

# 说明：本仓库的镜像依赖 dist/tools/ 下预先构建好的三个外部二进制
# （N_m3u8DL-RE / ffmpeg / mp4decrypt，amd64 + arm64），
# 它们由 scripts/build-tools.sh 产出、不入库，所以 CI 必须先跑这一步。
#
# 绿联上架用的 UPK 不走这里，见 Makefile 的 make images / make upk。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 交叉编译 ffmpeg / Bento4，并下载 N_m3u8DL-RE 的两个架构版本
      - name: Build external tools (amd64 + arm64)
        run: bash scripts/build-tools.sh all

      - name: Extract metadata for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          # 版本号是四段式（0.1.0.0005，最后一段是构建号），不符合 semver 规范，
          # 因此 type=semver 规则永远匹配不到。之前用标签发起构建时 tag 列表为空，
          # buildx 在 push: true 下直接报「tag is needed when pushing to registry」。
          # 改用 type=ref 把 git 标签原样作为镜像 tag，标签构建才能产出 v0.1.0.0005。
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
