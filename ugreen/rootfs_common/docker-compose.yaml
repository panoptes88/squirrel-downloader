# 松鼠下载器 —— UGOS Pro Docker 应用编排文件
#
# 位置固定：rootfs_common/docker-compose.yaml（该目录只允许 icon.png 与本文件）
#
# 运行时约定：
#   - 文件所在目录即 composition 的 project 目录，安装后为
#     /volume{N}/@appstore/com.panoptes88.squirrel
#   - ./data 是系统在安装目录里建好的软链，指向 /volume{N}/@appdata/{app_id}，
#     所以数据库放在 ./data/db 会落在应用专属数据目录，而不是安装目录里。
#     ⚠️ 按绿联文档，卸载应用时 data/log/cache 会被一并删除 —— 数据库不跨卸载保留；
#        用户的视频文件在 ${DOWNLOAD_PATH} 里，不受影响。
#   - 变量 ${TZ} 由 Docker 套件注入；${DOWNLOAD_PATH} 与 ${ADMIN_PASSWORD}
#     来自 project.yaml 的 parameters
#
# 安全：不使用 privileged / cap_add / host 网络，只发布一个声明过的端口。

services:
  squirrel:
    # 必须与 rootfs_{arch}/images/ 内 tar 的 tag 完全一致，且不能使用 latest。
    # 注意：不要写成 docker.io/panoptes88/... —— docker save 会把 Registry 前缀
    # 规范化掉，而 ugcli 是逐字符串比对，带前缀会被判成「未在 compose 中引用」。
    image: panoptes88/squirrel-downloader:0.1.0
    container_name: squirrel-downloader

    # 宿主机端口需与 project.yaml 的 port 一致；容器内固定 8080
    ports:
      - "21808:8080"

    volumes:
      # 用户选择的下载目录（安装参数）
      - ${DOWNLOAD_PATH}:/app/downloads
      # SQLite 数据库 + 会话，放在应用数据目录下（./data 指向 @appdata）
      - ./data/db:/app/db

    environment:
      - TZ=${TZ}
      - PORT=8080
      - DOWNLOAD_DIR=/app/downloads
      - DB_PATH=/app/db/data.db
      - BIN_DIR=/app/bin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # 中文文件名在容器内的字符集，避免 ls 转义与乱码
      - LANG=C.UTF-8
      # Cookie 走 http 时也为 Secure 会导致登录态失效，交给应用自行判断
      - ALLOW_INSECURE=true
      # 下载超时（秒），0 表示不限制
      - DOWNLOAD_TIMEOUT=0

    restart: always

    # 系统停止应用时会先发 SIGTERM 再强杀；留出时间让正在写入的分片收尾，
    # 避免半成品文件残留在用户目录里。
    stop_grace_period: 30s
